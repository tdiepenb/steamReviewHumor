[project]
name = "steamreviewhumor"
version = "0.0.1"
description = "A project analysing humor inn Steam reviews using BERT models."
authors = [
    { name = "Tilmann Diepenbruck", email = "tdiepenb@smail.uni-koeln.de" }
]
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "httpx>=0.28.1",
    "ipykernel>=7.1.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.10.8",
    "notebook>=7.5.3",
    "numpy>=2.4.1",
    "pandas>=2.3.3",
    "pandas-stubs>=3.0.0.260204",
    "scikit-learn>=1.8.0",
    "seaborn>=0.13.2",
    "torch>=2.10.0",
    "torchaudio>=2.10.0",
    "torchvision>=0.25.0",
    "tqdm>=4.67.1",
    "transformers>=5.1.0",
]

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch" },
]
torchvision = [
  { index = "pytorch" },
]
torchaudio = [
  { index = "pytorch" },
]
